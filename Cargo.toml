[package]
name = "aade-afm"
version = "0.2.0"
edition = "2024"

[dependencies]
keyring = { version = "3", features = ["windows-native"] }
native-windows-gui = { version = "1.0.13", default-features = false, features = ["high-dpi", "tabs", "embed-resource", "status-bar", "textbox", "combobox", "rich-textbox"] }
roxmltree = "0.21.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = "2"
winapi = { version = "0.3", features = ["wingdi", "winuser"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
